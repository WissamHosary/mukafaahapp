publish_to: none
version: 0.7.0+7

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  audioplayers: ^6.4.0
  mk_core:
    path: ../../packages/mk_core
  mk_ui:
    path: ../../packages/mk_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
